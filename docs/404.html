<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>earrow-hr-demo</title>
    <!--
      GitHub Pages SPA fallback. Encodes the requested path into a query string
      and redirects to index.html, which decodes it and hands off to the router.
      pathSegmentsToKeep = 1 keeps the project base path (/HR-New-Features/).
    -->
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
